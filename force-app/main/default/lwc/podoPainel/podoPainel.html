<template>
    <div class="podo-bs painel">
        <header class="hero d-flex flex-wrap justify-content-between align-items-center gap-3 p-4 rounded-4 text-white shadow">
            <div>
                <p class="hero-data mb-0 small opacity-75">{dataHoje}</p>
                <h1 class="h2 fw-bold my-1">{saudacao}! 👣</h1>
                <p class="mb-0 opacity-75">Veja como está o dia na clínica.</p>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-light rounded-pill fw-semibold px-4" onclick={atualizar}>Atualizar</button>
                <button class="btn btn-light rounded-pill fw-semibold px-4 text-primary" onclick={novoAgendamento}>
                    + Novo agendamento
                </button>
            </div>
        </header>

        <template lwc:if={erro}>
            <div class="alert alert-danger mt-3 mb-0" role="alert">{erro}</div>
        </template>

        <section class="row g-3 my-1">
            <div class="col-12 col-sm-6 col-xl-3">
                <div class="card cartao h-100 border-0 border-start border-4 border-primary shadow-sm">
                    <div class="card-body">
                        <div class="fs-3">📅</div>
                        <div class="display-6 fw-bold">{resumo.agendamentosHoje}</div>
                        <div class="text-secondary small">Agendamentos hoje</div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-xl-3">
                <div class="card cartao h-100 border-0 border-start border-4 border-warning shadow-sm">
                    <div class="card-body">
                        <div class="fs-3">⏳</div>
                        <div class="display-6 fw-bold">{resumo.aConfirmar}</div>
                        <div class="text-secondary small">Aguardando confirmação</div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-xl-3">
                <div class="card cartao h-100 border-0 border-start border-4 border-success shadow-sm">
                    <div class="card-body">
                        <div class="fs-3">🧑‍🤝‍🧑</div>
                        <div class="display-6 fw-bold">{resumo.pacientesAtivos}</div>
                        <div class="text-secondary small">Pacientes ativos</div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-xl-3">
                <div class="card cartao h-100 border-0 border-start border-4 border-info shadow-sm">
                    <div class="card-body">
                        <div class="fs-3">💰</div>
                        <div class="display-6 fw-bold">{receitaFormatada}</div>
                        <div class="text-secondary small">Receita do mês ({resumo.atendimentosMes} atend.)</div>
                    </div>
                </div>
            </div>
        </section>

        <section class="card border-0 shadow-sm mt-3">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h2 class="h5 mb-0">Próximos atendimentos</h2>
                    <button class="btn btn-link fw-semibold text-decoration-none p-0" onclick={verAgenda}>Ver todos</button>
                </div>

                <template lwc:if={semProximos}>
                    <p class="text-secondary text-center py-4 mb-0">Nenhum atendimento agendado. Que tal criar o primeiro?</p>
                </template>

                <ul class="list-group list-group-flush">
                    <template for:each={proximos} for:item="a">
                        <li key={a.id} class="item list-group-item list-group-item-action d-flex align-items-center gap-3 rounded-3" data-id={a.id} onclick={abrirAgendamento}>
                            <div class="item-hora text-center rounded-3 px-2 py-1">
                                <strong class="d-block">{a.hora}</strong>
                                <small>{a.dia}</small>
                            </div>
                            <div class="flex-grow-1">
                                <strong class="d-block">{a.paciente}</strong>
                                <small class="text-secondary">{a.detalhe}</small>
                            </div>
                            <span class={a.badgeClass}>{a.status}</span>
                        </li>
                    </template>
                </ul>
            </div>
        </section>

        <section class="row g-3 mt-1">
            <div class="col-12 col-md-4">
                <button class="btn btn-outline-primary bg-white w-100 py-3 fw-semibold rounded-4" onclick={novoPaciente}>
                    🧑 Novo paciente
                </button>
            </div>
            <div class="col-12 col-md-4">
                <button class="btn btn-outline-primary bg-white w-100 py-3 fw-semibold rounded-4" onclick={novoAgendamento}>
                    🗓️ Novo agendamento
                </button>
            </div>
            <div class="col-12 col-md-4">
                <button class="btn btn-outline-primary bg-white w-100 py-3 fw-semibold rounded-4" onclick={verAgenda}>
                    📋 Ver agenda
                </button>
            </div>
        </section>
    </div>
</template>
